<svg width="800" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="roomGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e2e8f0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tableGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:0.1" />
      <stop offset="100%" style="stop-color:#1351B4;stop-opacity:0.1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#roomGradient)"/>
  
  <!-- Wall with window -->
  <rect x="0" y="0" width="800" height="80" fill="#e2e8f0"/>
  <rect x="600" y="20" width="120" height="40" fill="#dbeafe" stroke="#1351B4" stroke-width="2" rx="4"/>
  <text x="660" y="35" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1351B4">JANELA</text>
  
  <!-- Brazilian Flag -->
  <rect x="50" y="20" width="60" height="40" fill="#009739"/>
  <polygon points="50,40 110,25 110,55" fill="#FFCD07"/>
  <circle cx="85" cy="40" r="12" fill="#002776"/>
  
  <!-- Conference Table -->
  <ellipse cx="400" cy="250" rx="300" ry="80" fill="#8b4513" opacity="0.8"/>
  <ellipse cx="400" cy="240" rx="300" ry="80" fill="url(#tableGradient)" stroke="#1351B4" stroke-width="2"/>
  
  <!-- Documents on table -->
  <rect x="350" y="200" width="40" height="30" fill="white" stroke="#ccc" stroke-width="1" rx="2"/>
  <rect x="450" y="210" width="35" height="25" fill="white" stroke="#ccc" stroke-width="1" rx="2"/>
  <text x="370" y="215" font-family="Arial, sans-serif" font-size="8" text-anchor="middle" fill="#1351B4">PNAE</text>
  
  <!-- Laptops -->
  <rect x="300" y="220" width="30" height="20" fill="#374151" rx="2"/>
  <rect x="302" y="222" width="26" height="16" fill="#1351B4" rx="1"/>
  <rect x="500" y="215" width="30" height="20" fill="#374151" rx="2"/>
  <rect x="502" y="217" width="26" height="16" fill="#1351B4" rx="1"/>
  
  <!-- Person 1 - Government Official (left) -->
  <circle cx="250" cy="150" r="25" fill="#d4a574"/>
  <rect x="235" y="175" width="30" height="40" fill="#1351B4" rx="15"/>
  <rect x="240" y="180" width="20" height="5" fill="white"/>
  <text x="250" y="285" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#374151">Coordenador</text>
  
  <!-- Person 2 - Education Agent (center-left) -->
  <circle cx="320" cy="160" r="22" fill="#e8b899"/>
  <rect x="308" y="182" width="24" height="35" fill="#059669" rx="12"/>
  <text x="320" y="285" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#374151">Agente</text>
  
  <!-- Person 3 - Administrator (center) -->
  <circle cx="400" cy="140" r="24" fill="#c8956d"/>
  <rect x="386" y="164" width="28" height="38" fill="#7c2d12" rx="14"/>
  <rect x="390" y="170" width="20" height="4" fill="#fbbf24"/>
  <text x="400" y="285" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#374151">Diretor</text>
  
  <!-- Person 4 - Teacher (center-right) -->
  <circle cx="480" cy="160" r="22" fill="#f3d5ab"/>
  <rect x="468" y="182" width="24" height="35" fill="#dc2626" rx="12"/>
  <text x="480" y="285" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#374151">Professor</text>
  
  <!-- Person 5 - Government Representative (right) -->
  <circle cx="550" cy="150" r="25" fill="#deb887"/>
  <rect x="535" y="175" width="30" height="40" fill="#1351B4" rx="15"/>
  <rect x="540" y="180" width="20" height="5" fill="white"/>
  <text x="550" y="285" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#374151">Ministério</text>
  
  <!-- Speech bubbles -->
  <ellipse cx="200" cy="100" rx="45" ry="20" fill="white" stroke="#1351B4" stroke-width="1"/>
  <polygon points="210,115 220,125 230,115" fill="white" stroke="#1351B4" stroke-width="1"/>
  <text x="200" y="105" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1351B4">Lançamento PNAE</text>
  
  <ellipse cx="600" cy="120" rx="50" ry="25" fill="white" stroke="#059669" stroke-width="1"/>
  <polygon points="570,135 575,145 580,135" fill="white" stroke="#059669" stroke-width="1"/>
  <text x="600" y="115" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#059669">Mais oportunidades</text>
  <text x="600" y="125" font-family="Arial, sans-serif" font-size="9" text-anchor="middle" fill="#059669">na educação</text>
  
  <!-- Title at bottom -->
  <rect x="0" y="350" width="800" height="50" fill="#1351B4"/>
  <text x="400" y="370" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="white">PROGRAMA NACIONAL DE AGENTES DA EDUCAÇÃO</text>
  <text x="400" y="385" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" fill="#FFCD07">Reunião de Lançamento - Governo Federal</text>
  
  <!-- Gov.br logo element -->
  <circle cx="750" cy="30" r="20" fill="white"/>
  <text x="750" y="37" font-family="Arial, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" fill="#1351B4">BR</text>
</svg>